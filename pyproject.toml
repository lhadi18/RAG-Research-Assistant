[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-research-assistant"
version = "0.1.0"
description = "Local-first RAG research assistant with reproducible retrieval evaluation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "streamlit>=1.39,<2",
  "pydantic-settings>=2.5,<3", "python-multipart>=0.0.12,<1", "httpx>=0.27,<1",
  "qdrant-client>=1.11,<2", "rank-bm25>=0.2.2,<1", "pymupdf>=1.24,<2",
  "pandas>=2.2,<4", "matplotlib>=3.9,<4", "python-dotenv>=1,<2", "requests>=2.32,<3"
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.1,<6"]
observability = ["arize-phoenix-otel>=0.8,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
