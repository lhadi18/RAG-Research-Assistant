services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      args:
        INSTALL_OBSERVABILITY: ${INSTALL_OBSERVABILITY:-false}
    command: ["uvicorn", "rag_assistant.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      PHOENIX_ENDPOINT: http://phoenix:6006
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    volumes: ["app_data:/app/data", "./reports:/app/reports"]
    depends_on:
      qdrant:
        condition: service_healthy
  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0"]
    env_file: [.env]
    environment: ["RAG_API_URL=http://api:8000"]
    ports: ["8501:8501"]
    depends_on: [api]
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["observability"]
    ports: ["6006:6006", "4317:4317"]
    volumes: ["phoenix_data:/phoenix"]
volumes:
  qdrant_data:
  app_data:
  phoenix_data:
